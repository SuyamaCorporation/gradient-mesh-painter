<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グラジエントメッシュ ペインター</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-4">

  <header class="text-center mb-6 mt-2">
    <h1 class="text-2xl font-bold text-white">グラジエントメッシュ ペインター</h1>
    <p class="text-gray-400 text-sm mt-1">Gradient Mesh Painter</p>
  </header>

  <div class="w-full max-w-4xl flex flex-col lg:flex-row gap-6 items-start justify-center">

    <!-- Canvas area -->
    <div class="flex flex-col items-center gap-3">
      <canvas id="meshCanvas" width="500" height="500"
        class="rounded-xl border border-gray-700 cursor-crosshair"
        role="img" aria-label="グラジエントメッシュキャンバス"
        style="max-width:100%;height:auto;"></canvas>
      <p class="text-gray-500 text-xs">コントロールポイントをクリックして選択し、カラーピッカーで色を変更</p>
    </div>

    <!-- Controls -->
    <div class="flex flex-col gap-4 flex-1 min-w-0 lg:max-w-xs">

      <!-- Selected point info -->
      <div class="bg-gray-800 rounded-xl p-4">
        <h2 class="text-gray-300 text-sm font-semibold mb-3">選択ポイント Selected Point</h2>
        <div id="noSelection" class="text-gray-500 text-xs">ポイントをクリックして選択してください</div>
        <div id="selectionPanel" class="hidden flex-col gap-3">
          <div class="flex items-center gap-3">
            <span id="selPointLabel" class="text-gray-400 text-xs">ポイント (0,0)</span>
            <div id="selColorPreview" class="w-8 h-8 rounded-lg border-2 border-gray-600"></div>
          </div>
          <div class="flex items-center gap-3">
            <label for="colorPicker" class="text-gray-400 text-xs w-20 shrink-0">色を変更</label>
            <input id="colorPicker" type="color" value="#ff0000"
              class="w-12 h-8 rounded border-0 bg-transparent cursor-pointer"
              aria-label="選択ポイントの色">
          </div>
        </div>
      </div>

      <!-- Presets -->
      <div class="bg-gray-800 rounded-xl p-4">
        <h2 class="text-gray-300 text-sm font-semibold mb-3">プリセット Presets</h2>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="applyPreset('rainbow')" class="py-2 px-3 rounded-lg text-xs font-medium bg-gradient-to-r from-red-500 to-blue-500 hover:opacity-90 transition-opacity">虹 Rainbow</button>
          <button onclick="applyPreset('sunset')"  class="py-2 px-3 rounded-lg text-xs font-medium bg-gradient-to-r from-orange-600 to-purple-600 hover:opacity-90 transition-opacity">夕焼け Sunset</button>
          <button onclick="applyPreset('ocean')"   class="py-2 px-3 rounded-lg text-xs font-medium bg-gradient-to-r from-cyan-600 to-blue-900 hover:opacity-90 transition-opacity">海 Ocean</button>
          <button onclick="applyPreset('mono')"    class="py-2 px-3 rounded-lg text-xs font-medium bg-gradient-to-r from-gray-700 to-gray-200 hover:opacity-90 transition-opacity text-gray-900">モノクロ Mono</button>
        </div>
      </div>

      <!-- Options -->
      <div class="bg-gray-800 rounded-xl p-4 flex flex-col gap-3">
        <h2 class="text-gray-300 text-sm font-semibold">表示 Display</h2>
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="showGrid" type="checkbox" checked class="accent-indigo-500 w-4 h-4" aria-label="グリッドを表示">
          <span class="text-gray-300 text-xs">グリッド表示 Show Grid</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="showPoints" type="checkbox" checked class="accent-indigo-500 w-4 h-4" aria-label="コントロールポイントを表示">
          <span class="text-gray-300 text-xs">ポイント表示 Show Points</span>
        </label>
      </div>

      <!-- Download -->
      <div class="bg-gray-800 rounded-xl p-4">
        <button id="downloadBtn" class="w-full py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 transition-colors">
          PNG ダウンロード
        </button>
      </div>

    </div>
  </div>

  <script>
    const canvas = document.getElementById('meshCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const GRID = 4; // 4x4 control points
    const PAD = 30;
    const CELL_W = (W - PAD*2) / (GRID - 1);
    const CELL_H = (H - PAD*2) / (GRID - 1);
    const POINT_R = 8;
    const CLICK_RADIUS = 14;

    let selectedPoint = null; // {row, col}
    let showGrid = true;
    let showPoints = true;

    // 4x4 colors (row x col), stored as [r,g,b]
    let colors = Array.from({length: GRID}, () => Array(GRID).fill(null));

    // Presets
    const PRESETS = {
      rainbow: [
        [[255,0,0],   [255,128,0], [255,255,0], [128,255,0]],
        [[0,255,0],   [0,255,128], [0,255,255], [0,128,255]],
        [[0,0,255],   [128,0,255], [255,0,255], [255,0,128]],
        [[255,64,64], [64,255,64], [64,64,255], [200,200,50]]
      ],
      sunset: [
        [[30,0,60],   [60,0,80],   [100,0,80],  [140,0,60]],
        [[160,20,40], [200,40,20], [220,80,20], [200,120,30]],
        [[230,120,30],[240,160,40],[240,180,60],[220,160,80]],
        [[250,200,80],[255,220,100],[255,240,130],[255,255,180]]
      ],
      ocean: [
        [[0,10,60],   [0,20,80],   [0,30,100],  [0,40,120]],
        [[0,60,120],  [0,80,140],  [0,100,160], [0,120,180]],
        [[0,140,180], [0,160,200], [20,180,210],[40,200,220]],
        [[100,220,230],[140,230,240],[180,240,250],[220,250,255]]
      ],
      mono: [
        [[10,10,10],  [50,50,50],  [100,100,100],[150,150,150]],
        [[40,40,40],  [80,80,80],  [120,120,120],[170,170,170]],
        [[70,70,70],  [110,110,110],[150,150,150],[200,200,200]],
        [[100,100,100],[140,140,140],[180,180,180],[230,230,230]]
      ]
    };

    function applyPreset(name) {
      const p = PRESETS[name];
      for (let r = 0; r < GRID; r++)
        for (let c = 0; c < GRID; c++)
          colors[r][c] = [...p[r][c]];
      render();
      saveState();
    }

    function pointPos(row, col) {
      return { x: PAD + col * CELL_W, y: PAD + row * CELL_H };
    }

    // Bilinear interpolation of color
    function bilinearColor(u, v, c00, c10, c01, c11) {
      // u=0..1 (x in cell), v=0..1 (y in cell)
      // c00=top-left, c10=top-right, c01=bottom-left, c11=bottom-right
      return [
        c00[0]*(1-u)*(1-v) + c10[0]*u*(1-v) + c01[0]*(1-u)*v + c11[0]*u*v,
        c00[1]*(1-u)*(1-v) + c10[1]*u*(1-v) + c01[1]*(1-u)*v + c11[1]*u*v,
        c00[2]*(1-u)*(1-v) + c10[2]*u*(1-v) + c01[2]*(1-u)*v + c11[2]*u*v
      ];
    }

    function renderMesh() {
      // Render each cell using ImageData for efficiency
      const imgData = ctx.createImageData(W, H);
      const data = imgData.data;

      for (let py = 0; py < H; py++) {
        for (let px = 0; px < W; px++) {
          // Determine which cell (col, row)
          const fx = (px - PAD) / CELL_W;
          const fy = (py - PAD) / CELL_H;

          let col = Math.floor(fx);
          let row = Math.floor(fy);
          let u = fx - col;
          let v = fy - row;

          // Clamp to valid cell range
          if (col < 0) { col = 0; u = 0; }
          if (row < 0) { row = 0; v = 0; }
          if (col >= GRID-1) { col = GRID-2; u = 1; }
          if (row >= GRID-1) { row = GRID-2; v = 1; }

          const c00 = colors[row][col];
          const c10 = colors[row][col+1];
          const c01 = colors[row+1][col];
          const c11 = colors[row+1][col+1];

          if (!c00 || !c10 || !c01 || !c11) continue;

          const [r,g,b] = bilinearColor(u, v, c00, c10, c01, c11);
          const idx = (py * W + px) * 4;
          data[idx]   = Math.round(Math.max(0,Math.min(255,r)));
          data[idx+1] = Math.round(Math.max(0,Math.min(255,g)));
          data[idx+2] = Math.round(Math.max(0,Math.min(255,b)));
          data[idx+3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function renderGrid() {
      if (!showGrid) return;
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      // Horizontal lines
      for (let r = 0; r < GRID; r++) {
        ctx.beginPath();
        const y = PAD + r * CELL_H;
        ctx.moveTo(PAD, y);
        ctx.lineTo(PAD + (GRID-1)*CELL_W, y);
        ctx.stroke();
      }
      // Vertical lines
      for (let c = 0; c < GRID; c++) {
        ctx.beginPath();
        const x = PAD + c * CELL_W;
        ctx.moveTo(x, PAD);
        ctx.lineTo(x, PAD + (GRID-1)*CELL_H);
        ctx.stroke();
      }
    }

    function renderPoints() {
      if (!showPoints) return;
      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          const {x, y} = pointPos(r, c);
          const col = colors[r][c] || [128,128,128];
          const isSelected = selectedPoint && selectedPoint.row === r && selectedPoint.col === c;

          ctx.beginPath();
          ctx.arc(x, y, isSelected ? POINT_R + 3 : POINT_R, 0, 2*Math.PI);
          ctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
          ctx.fill();
          ctx.strokeStyle = isSelected ? '#ffffff' : 'rgba(255,255,255,0.6)';
          ctx.lineWidth = isSelected ? 3 : 1.5;
          ctx.stroke();

          if (isSelected) {
            ctx.beginPath();
            ctx.arc(x, y, POINT_R + 7, 0, 2*Math.PI);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
    }

    function render() {
      renderMesh();
      renderGrid();
      renderPoints();
    }

    // Canvas interaction
    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;

      let closest = null, minDist = Infinity;
      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          const {x, y} = pointPos(r, c);
          const d = Math.sqrt((mx-x)**2 + (my-y)**2);
          if (d < minDist) { minDist = d; closest = {row: r, col: c}; }
        }
      }

      if (closest && minDist <= CLICK_RADIUS * (W / rect.width)) {
        selectedPoint = closest;
        updateSelectionPanel();
        render();
      }
    });

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
    }
    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return [r,g,b];
    }

    function updateSelectionPanel() {
      const noSel = document.getElementById('noSelection');
      const selPanel = document.getElementById('selectionPanel');
      if (!selectedPoint) {
        noSel.classList.remove('hidden');
        selPanel.classList.add('hidden');
        selPanel.classList.remove('flex');
        return;
      }
      noSel.classList.add('hidden');
      selPanel.classList.remove('hidden');
      selPanel.classList.add('flex');
      const {row, col} = selectedPoint;
      document.getElementById('selPointLabel').textContent = `ポイント (行${row+1}, 列${col+1})`;
      const c = colors[row][col] || [128,128,128];
      const hex = rgbToHex(c[0], c[1], c[2]);
      document.getElementById('selColorPreview').style.background = hex;
      document.getElementById('colorPicker').value = hex;
    }

    document.getElementById('colorPicker').addEventListener('input', e => {
      if (!selectedPoint) return;
      const {row, col} = selectedPoint;
      colors[row][col] = hexToRgb(e.target.value);
      document.getElementById('selColorPreview').style.background = e.target.value;
      render();
      saveState();
    });

    document.getElementById('showGrid').addEventListener('change', e => {
      showGrid = e.target.checked;
      render();
      saveState();
    });
    document.getElementById('showPoints').addEventListener('change', e => {
      showPoints = e.target.checked;
      render();
      saveState();
    });

    // Download
    document.getElementById('downloadBtn').addEventListener('click', () => {
      // Render without overlay for clean PNG
      const wasShowPoints = showPoints;
      const wasShowGrid = showGrid;
      showPoints = false; showGrid = false;
      renderMesh();
      const link = document.createElement('a');
      link.download = 'gradient-mesh.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      showPoints = wasShowPoints;
      showGrid = wasShowGrid;
      render();
    });

    // Persistence
    function saveState() {
      localStorage.setItem('gradientMesh', JSON.stringify({ colors, showGrid, showPoints }));
    }
    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem('gradientMesh'));
        if (s && s.colors && s.colors.length === GRID) {
          colors = s.colors;
          if (s.showGrid != null) showGrid = s.showGrid;
          if (s.showPoints != null) showPoints = s.showPoints;
          document.getElementById('showGrid').checked = showGrid;
          document.getElementById('showPoints').checked = showPoints;
        } else {
          applyPreset('rainbow');
        }
      } catch(e) { applyPreset('rainbow'); }
    }

    loadState();
    render();
  </script>
</body>
</html>
